[package]
name = "custos-dedup"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Explainable cross-source security finding deduplication with stable fingerprints and PURL/CPE-aware matching"
documentation = "https://docs.rs/custos-dedup"
repository = "https://github.com/brianluby/custos-dedup"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["security", "deduplication", "sbom", "purl", "cpe"]
categories = ["algorithms", "data-structures", "development-tools", "text-processing"]
publish = ["crates-io"]
include = [
    "src/**/*.rs",
    "tests/**/*.rs",
    "examples/**/*.rs",
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "SECURITY.md",
    "LICENSE-APACHE",
    "LICENSE-MIT",
]

[features]
default = []
serde = ["dep:serde"]

[dependencies]
blake3 = "1.8"
cpe = { version = "0.1.5", default-features = false }
packageurl = { version = "0.6", features = ["memchr"] }
rapidfuzz = "0.5"
serde = { version = "1", features = ["derive"], optional = true }
thiserror = "2"

[dev-dependencies]
serde_json = "1"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
perf = "warn"
redundant_clone = "warn"
