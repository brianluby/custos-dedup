name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  supply-chain:
    name: Supply-chain policy
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal

      - name: Install cargo-audit
        run: cargo +stable install cargo-audit --version 0.22.2 --locked --no-default-features

      - name: Audit Rust dependencies
        run: cargo +stable audit --deny warnings

      - name: Check dependency licenses and sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          arguments: --all-features --locked
          command: check
          command-arguments: bans licenses sources

  stable:
    name: Stable toolchain
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - name: Check formatting
        run: cargo +stable fmt --all -- --check

      - name: Run Clippy
        run: cargo +stable clippy --all-targets --all-features --locked -- -D warnings

      - name: Run default-feature tests
        run: cargo +stable test --locked

      - name: Run all-feature tests
        run: cargo +stable test --all-features --locked

      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +stable doc --all-features --no-deps --locked

      - name: Verify package
        run: cargo +stable package --locked

  msrv:
    name: Rust 1.85
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Rust 1.85
        run: rustup toolchain install 1.85.0 --profile minimal

      - name: Test all targets and features
        run: cargo +1.85.0 test --all-targets --all-features --locked
